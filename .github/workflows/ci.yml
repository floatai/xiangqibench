name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,anthropic]"
      - run: pytest -m "not engine" --cov=xiangqibench --cov-report=term-missing

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Upstream publishes only the network for its latest code, so CI tracks master.
      - name: Resolve Pikafish master
        id: ref
        run: echo "sha=$(git ls-remote https://github.com/official-pikafish/Pikafish refs/heads/master | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pikafish
        with:
          path: ~/pikafish
          key: pikafish-${{ runner.os }}-clang-${{ steps.ref.outputs.sha }}
      - name: Build Pikafish
        if: steps.pikafish.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/official-pikafish/Pikafish /tmp/Pikafish
          git -C /tmp/Pikafish checkout "${{ steps.ref.outputs.sha }}"
          make -C /tmp/Pikafish/src -j"$(nproc)" build ARCH=x86-64-avx2 COMP=clang
          mkdir -p ~/pikafish
          cp /tmp/Pikafish/src/pikafish /tmp/Pikafish/src/pikafish.nnue ~/pikafish/
      - run: pip install -e ".[dev]"
      - run: xiangqibench doctor --engine-path ~/pikafish/pikafish
      - run: PIKAFISH_PATH="$HOME/pikafish/pikafish" pytest -m engine

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/xiangqibench --version
          /tmp/wheel-env/bin/xiangqibench modes
          /tmp/wheel-env/bin/xiangqibench cases | tail -1
          /tmp/wheel-env/bin/xiangqibench prompt --mode restricted > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
